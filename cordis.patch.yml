# dsh bundle layer: mount the Vault Wall plugin.
# id = name = 包名；函数插件命名导出（name/Config/apply）挂载。
# 路径型配置不在 bundle 里硬编码（会随包发给所有用户）——
# 由宿主默认解析：config > env DSH_VAULT_WALL_RULES > ~/.dsh/vault-wall-rules.json。
# 需要自定义路径时，在 profile 自己的 cordis.patch.yml 里覆盖该行 config。
- insert:
    - id: dsh-vault-wall
      name: dsh-vault-wall
